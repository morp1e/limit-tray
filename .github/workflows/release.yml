name: Release

# Pushing a v* tag builds the executable and publishes it. The binary attached to
# a release is therefore always the one this workflow built from that exact tag,
# not something produced on a developer's machine.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, e.g. v0.2.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # A release that ships a failing build is worse than no release.
      - name: Test
        run: dotnet test --configuration Release

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') {
            $env:GITHUB_REF -replace '^refs/tags/', ''
          } else {
            '${{ github.event.inputs.tag }}'
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag -replace '^v', '')" >> $env:GITHUB_OUTPUT

      # NativeAOT: one native executable, no .NET needed on the machine. The project sets
      # PublishAot; the runner's Visual Studio provides the MSVC linker. v0.3's WPF build
      # was a 74 MB compressed single file that unpacked itself into memory at start.
      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/LimitTray.Native `
            --configuration Release `
            --runtime win-x64 `
            -p:Version=${{ steps.version.outputs.version }} `
            --output publish/release

      - name: Name and checksum the artifact
        shell: pwsh
        run: |
          $name = "limit-tray-${{ steps.version.outputs.tag }}-win-x64.exe"
          Move-Item publish/release/LimitTray.exe "publish/release/$name"
          $hash = (Get-FileHash "publish/release/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File "publish/release/$name.sha256" -Encoding ascii
          Write-Host "$name  $hash"

      # The GitHub CLI is preinstalled on the runner. A repository that asks people
      # to trust an unsigned binary should not add a third-party action to the step
      # that produces it.
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $assets = Get-ChildItem publish/release | Where-Object { $_.Extension -in '.exe', '.sha256' }
          if ($assets.Count -lt 2) { throw "expected the executable and its checksum, found $($assets.Count)" }

          if (gh release view $tag 2>$null) {
            gh release upload $tag $assets.FullName --clobber
          } else {
            gh release create $tag $assets.FullName `
              --title $tag `
              --generate-notes `
              --verify-tag
          }
